name: Agouz daily verified backup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
      timezone: Africa/Cairo
permissions:
  contents: read
concurrency:
  group: agouz-production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
      - name: Install verified backup tools
        run: bash scripts/backup/setup-cloud.sh
      - name: Export, encrypt, upload, restore and verify
        env:
          AGOUZ_DATABASE_URL: ${{ secrets.AGOUZ_DATABASE_URL }}
          AGOUZ_BACKUP_KEY: ${{ secrets.AGOUZ_BACKUP_KEY }}
          AGOUZ_DRIVE_CONFIG: ${{ secrets.AGOUZ_DRIVE_CONFIG }}
          AGOUZ_STORAGE_READER_JSON: ${{ secrets.AGOUZ_STORAGE_READER_JSON }}
          AGOUZ_SETTINGS_READ_TOKEN: ${{ secrets.AGOUZ_SETTINGS_READ_TOKEN }}
          AGOUZ_RECOVERY_CONFIG_JSON: ${{ secrets.AGOUZ_RECOVERY_CONFIG_JSON }}
          AGOUZ_REQUIRE_PROVIDER_SETTINGS: "true"
          AGOUZ_BACKUP_ROOT: ${{ runner.temp }}/agouz-backup
          AGOUZ_PG_BIN: /usr/lib/postgresql/18/bin
          AGOUZ_RCLONE: ${{ runner.temp }}/rclone/rclone-v1.75.2-linux-amd64/rclone
          AGOUZ_RCLONE_CONFIG: ${{ runner.temp }}/agouz-backup/drive.conf
        run: |
          umask 077
          mkdir -p "$AGOUZ_BACKUP_ROOT/pending"
          printf '%s' "$AGOUZ_BACKUP_KEY" > "$AGOUZ_BACKUP_ROOT/recovery-key.base64"
          printf '%s' "$AGOUZ_DRIVE_CONFIG" > "$AGOUZ_RCLONE_CONFIG"
          unset AGOUZ_BACKUP_KEY AGOUZ_DRIVE_CONFIG
          node scripts/backup/run-daily.mjs
      - name: Clear temporary backup credentials and plaintext
        if: always()
        run: |
          test "$RUNNER_TEMP/agouz-backup" != / 
          rm -rf -- "$RUNNER_TEMP/agouz-backup"
  keep-schedule-active:
    needs: backup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
      - name: Keep the public repository schedule active
        run: node scripts/backup/keep-schedule-active.mjs


