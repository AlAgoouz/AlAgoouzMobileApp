name: Agouz PDF native runtime
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/pdf/build-native.sh', '.github/workflows/pdf-native.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/pdf/build-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agouz-pdf-native
          path: backend/native/
