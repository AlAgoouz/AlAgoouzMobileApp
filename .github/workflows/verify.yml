name: Verify Agouz
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/generate-store-schema.mjs --check
      - run: node --test tests/backup-archive.node.test.mjs
      - run: npm test
      - name: Start isolated PostgreSQL validation
        run: docker compose -f tests/integration/compose.yml up -d --wait
      - name: Test financial rules on PostgreSQL
        env:
          AGOUZ_TEST_PG_CONTAINER: agouz_mobile_validation-db-1
        run: npm test -- tests/server-validation.postgres.test.ts
      - name: Stop isolated PostgreSQL validation
        if: always()
        run: docker compose -f tests/integration/compose.yml down -v
      - run: npm run build
      - run: npm audit --audit-level=moderate

