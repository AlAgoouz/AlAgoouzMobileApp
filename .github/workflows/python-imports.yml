name: Agouz online Python imports
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 poppler-utils
      - run: python -m unittest discover -s backend -v
        env:
          AGOUZ_PDF_REQUIRED: '1'
      - name: Render Arabic report examples
        run: |
          pdftoppm -png -scale-to 1400 -f 1 -singlefile tmp/report-examples/Agouz-report-ar.pdf tmp/report-examples/report-preview
          pdftoppm -png -scale-to 1400 -f 1 -singlefile tmp/report-examples/Agouz-invoice-ar.pdf tmp/report-examples/invoice-preview
      - uses: actions/upload-artifact@v4
        with:
          name: agouz-report-examples
          path: tmp/report-examples/
          if-no-files-found: error
