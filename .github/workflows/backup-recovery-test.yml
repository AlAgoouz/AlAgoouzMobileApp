name: Agouz files and secrets recovery test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AGOUZ_BACKUP_ROOT: ${{ github.workspace }}/.agouz-recovery-temp
      AGOUZ_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash scripts/backup/setup-cloud.sh
      - run: node --test tests/backup/*.node.test.mjs
      - run: node tests/backup/complete-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: complete-backup-recovery-proof
          path: complete-backup-recovery-proof.json
      - name: Clear synthetic credentials and recovered plaintext
        if: always()
        run: rm -rf -- "$AGOUZ_BACKUP_ROOT"
