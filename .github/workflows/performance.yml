name: Agouz slow mobile performance
on:
  pull_request:
    paths: ['src/**', 'tests/performance/**', 'package*.json', '.github/workflows/performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agouz-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build baseline and current production bundles with loopback-only fixture settings
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:5284
          VITE_SUPABASE_PUBLISHABLE_KEY: fixture-only-public-key
        run: |
          git worktree add --detach "$RUNNER_TEMP/agouz-baseline" 06388ff0ffb089fc19064f8bd6f6487974543bd8
          npm ci --prefix "$RUNNER_TEMP/agouz-baseline"
          (cd "$RUNNER_TEMP/agouz-baseline" && npm run build)
          npm run build
      - name: Measure three runs per build under identical CPU and slow 3G conditions
        run: |
          set -euo pipefail
          node tests/performance/server.mjs "$RUNNER_TEMP/agouz-baseline/dist" > baseline-server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:5284/__perf__/metrics && break || sleep 1; done
          node tests/performance/measure.mjs baseline
          kill "$fixture_pid"
          wait "$fixture_pid" || true
          node tests/performance/server.mjs dist > current-server.log 2>&1 &
          fixture_pid=$!
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:5284/__perf__/metrics && break || sleep 1; done
          node tests/performance/measure.mjs current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agouz-slow-mobile-performance
          path: |
            *-performance.json
            *-mobile.png
          if-no-files-found: error
